<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Keycap 3D Gradients -->
    <!-- HTML (Orange) -->
    <linearGradient id="htmlTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/><stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="htmlSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C2410C"/><stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>

    <!-- React (Cyan) -->
    <linearGradient id="reactTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="reactSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369A1"/><stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- JS (Yellow) -->
    <linearGradient id="jsTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/><stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="jsSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CA8A04"/><stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>

    <!-- TS (Blue) -->
    <linearGradient id="tsTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="tsSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Node/Vue (Green) -->
    <linearGradient id="greenTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/><stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="greenSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/><stop offset="100%" stop-color="#14532D"/>
    </linearGradient>

    <!-- Next / Dark (Slate) -->
    <linearGradient id="darkTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="darkSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- NestJS (Rose) -->
    <linearGradient id="roseTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185"/><stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="roseSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BE123C"/><stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Shadows & Glow Filters -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Consolas, sans-serif; }
    
    .floating-stage {
      animation: floatBoard 5s ease-in-out infinite;
    }

    .key-bounce-1 { animation: keyPulse 3s ease-in-out infinite 0.2s; }
    .key-bounce-2 { animation: keyPulse 3.4s ease-in-out infinite 0.7s; }
    .key-bounce-3 { animation: keyPulse 3.1s ease-in-out infinite 1.2s; }

    @keyframes floatBoard {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(0.4deg); }
    }

    @keyframes keyPulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .shimmer {
      animation: shimmerText 3s ease-in-out infinite;
    }

    @keyframes shimmerText {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.8)); }
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="460" rx="20" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="899" height="459" rx="20" fill="none" stroke="#1E293B"/>

  <!-- Top Title -->
  <g transform="translate(450, 48)" text-anchor="middle">
    <text font-size="34" font-weight="900" fill="#F8FAFC" letter-spacing="4">SKILLS</text>
    <text y="24" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="1.5" class="shimmer">(hint: 3D interactive keycaps architecture)</text>
  </g>

  <!-- Left Side: Interactive Quote Card (Like image 1) -->
  <g transform="translate(48, 120)">
    <rect width="260" height="260" rx="16" fill="#0F172A" fill-opacity="0.8" stroke="#334155" filter="url(#cardShadow)"/>
    
    <!-- Accent Top Bar -->
    <rect x="20" y="22" width="40" height="3" rx="1.5" fill="#38BDF8"/>
    <text x="20" y="44" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1">CORE FRONTEND</text>
    
    <text x="20" y="80" font-size="28" font-weight="800" fill="#FFFFFF">HTML5</text>
    <text x="115" y="78" font-size="20">🌐</text>

    <!-- Quote -->
    <rect x="20" y="104" width="3" height="48" fill="#38BDF8" rx="1.5"/>
    <text x="32" y="122" font-size="13" fill="#94A3B8" font-style="italic">"Internet's granddad,</text>
    <text x="32" y="142" font-size="13" fill="#94A3B8" font-style="italic">still kickin' fr fr!"</text>

    <!-- Key badge -->
    <rect x="20" y="180" width="110" height="28" rx="6" fill="#1E293B" stroke="#475569"/>
    <text x="32" y="198" font-size="11" font-weight="700" fill="#38BDF8" font-family="monospace">KEY: [ H ]</text>

    <!-- Status -->
    <circle cx="28" cy="232" r="4" fill="#10B981"/>
    <text x="40" y="236" font-size="12" fill="#94A3B8">3D Tactile Feedback</text>
  </g>

  <!-- Right Stage: Isometric 3D Floating Keyboard -->
  <g class="floating-stage" transform="translate(340, 70)">

    <!-- Keyboard Base Plate (Isometric Polygon) -->
    <polygon points="170,40 510,130 350,330 10,240" fill="#0B111D" stroke="#1E293B" stroke-width="2" filter="url(#cardShadow)"/>
    <polygon points="10,240 350,330 350,344 10,254" fill="#070A10"/>
    <polygon points="350,330 510,130 510,144 350,344" fill="#03060B"/>

    <!-- Keycaps Group arranged in 3D Isometric Steps -->

    <!-- ROW 1 (Back) -->
    <!-- Vue -->
    <g class="key-bounce-1" transform="translate(190, 80)">
      <polygon points="0,18 42,6 80,18 38,30" fill="url(#greenTop)"/>
      <polygon points="0,18 38,30 38,42 0,30" fill="url(#greenSide)"/>
      <polygon points="38,30 80,18 80,30 38,42" fill="#0F4722"/>
      <text x="38" y="22" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">Vue</text>
    </g>

    <!-- Next.js -->
    <g class="key-bounce-2" transform="translate(250, 96)">
      <polygon points="0,18 42,6 80,18 38,30" fill="url(#darkTop)"/>
      <polygon points="0,18 38,30 38,42 0,30" fill="url(#darkSide)"/>
      <polygon points="38,30 80,18 80,30 38,42" fill="#020617"/>
      <text x="38" y="22" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">Next</text>
    </g>

    <!-- Tailwind -->
    <g class="key-bounce-3" transform="translate(310, 112)">
      <polygon points="0,18 42,6 80,18 38,30" fill="url(#reactTop)"/>
      <polygon points="0,18 38,30 38,42 0,30" fill="url(#reactSide)"/>
      <polygon points="38,30 80,18 80,30 38,42" fill="#024E7A"/>
      <text x="38" y="22" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">Tailwind</text>
    </g>

    <!-- ROW 2 -->
    <!-- React -->
    <g class="key-bounce-2" transform="translate(140, 118)">
      <polygon points="0,18 42,6 80,18 38,30" fill="url(#reactTop)"/>
      <polygon points="0,18 38,30 38,42 0,30" fill="url(#reactSide)"/>
      <polygon points="38,30 80,18 80,30 38,42" fill="#024E7A"/>
      <text x="38" y="22" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">React</text>
    </g>

    <!-- TypeScript -->
    <g class="key-bounce-1" transform="translate(200, 134)">
      <polygon points="0,18 42,6 80,18 38,30" fill="url(#tsTop)"/>
      <polygon points="0,18 38,30 38,42 0,30" fill="url(#tsSide)"/>
      <polygon points="38,30 80,18 80,30 38,42" fill="#133374"/>
      <text x="38" y="22" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">TS</text>
    </g>

    <!-- Node.js -->
    <g class="key-bounce-3" transform="translate(260, 150)">
      <polygon points="0,18 42,6 80,18 38,30" fill="url(#greenTop)"/>
      <polygon points="0,18 38,30 38,42 0,30" fill="url(#greenSide)"/>
      <polygon points="38,30 80,18 80,30 38,42" fill="#0F4722"/>
      <text x="38" y="22" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">Node</text>
    </g>

    <!-- NestJS -->
    <g class="key-bounce-2" transform="translate(320, 166)">
      <polygon points="0,18 42,6 80,18 38,30" fill="url(#roseTop)"/>
      <polygon points="0,18 38,30 38,42 0,30" fill="url(#roseSide)"/>
      <polygon points="38,30 80,18 80,30 38,42" fill="#580C23"/>
      <text x="38" y="22" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">Nest</text>
    </g>

    <!-- ROW 3 (Front / Interactive Focus) -->
    <!-- HTML5 (Highlighted / Depressed) -->
    <g transform="translate(90, 156)">
      <!-- Pressed key effect -->
      <polygon points="0,22 42,10 80,22 38,34" fill="url(#htmlTop)" stroke="#FED7AA" stroke-width="1.5" filter="url(#neonGlow)"/>
      <polygon points="0,22 38,34 38,42 0,30" fill="url(#htmlSide)"/>
      <polygon points="38,34 80,22 80,30 38,42" fill="#431407"/>
      <text x="38" y="26" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">HTML5</text>
      
      <!-- Mouse cursor pointer -->
      <g transform="translate(30, 8)">
        <polygon points="0,0 0,14 4,11 7,17 10,15 7,9 12,9" fill="#38BDF8" stroke="#0F172A" stroke-width="1.2"/>
      </g>
    </g>

    <!-- JavaScript -->
    <g class="key-bounce-3" transform="translate(150, 172)">
      <polygon points="0,18 42,6 80,18 38,30" fill="url(#jsTop)"/>
      <polygon points="0,18 38,30 38,42 0,30" fill="url(#jsSide)"/>
      <polygon points="38,30 80,18 80,30 38,42" fill="#583506"/>
      <text x="38" y="22" font-size="12" font-weight="900" fill="#18181B" text-anchor="middle">JS</text>
    </g>

    <!-- Docker -->
    <g class="key-bounce-1" transform="translate(210, 188)">
      <polygon points="0,18 42,6 80,18 38,30" fill="url(#reactTop)"/>
      <polygon points="0,18 38,30 38,42 0,30" fill="url(#reactSide)"/>
      <polygon points="38,30 80,18 80,30 38,42" fill="#024E7A"/>
      <text x="38" y="22" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">Docker</text>
    </g>

    <!-- Git -->
    <g class="key-bounce-2" transform="translate(270, 204)">
      <polygon points="0,18 42,6 80,18 38,30" fill="url(#htmlTop)"/>
      <polygon points="0,18 38,30 38,42 0,30" fill="url(#htmlSide)"/>
      <polygon points="38,30 80,18 80,30 38,42" fill="#431407"/>
      <text x="38" y="22" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">Git</text>
    </g>

  </g>
</svg>