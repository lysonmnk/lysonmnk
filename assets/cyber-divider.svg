<svg xmlns="http://www.w3.org/2000/svg" width="900" height="20" viewBox="0 0 900 20">
  <defs>
    <linearGradient id="divLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="40" y1="10" x2="860" y2="10" stroke="url(#divLine)" stroke-width="1.2"/>
  <g filter="url(#divGlow)">
    <polygon points="450,5 455,10 450,15 445,10" fill="#38BDF8"/>
    <circle cx="430" cy="10" r="1.5" fill="#38BDF8" opacity="0.6"/>
    <circle cx="470" cy="10" r="1.5" fill="#38BDF8" opacity="0.6"/>
  </g>
</svg>