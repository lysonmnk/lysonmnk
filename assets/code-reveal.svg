<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Courier New', Consolas, monospace; }
    .t   { font-size: 13px; fill: #38BDF8; opacity: 0; animation: twinkle 3s ease-in-out infinite; }
    .g   { font-size: 64px; font-weight: 700; fill: #38BDF8; opacity: 0; animation: flick 0.12s step-end 3; }
    .f   { font-size: 64px; font-weight: 700; fill: #F8FAFC; opacity: 0; animation: reveal 0.1s ease-out forwards; }
    .cur { font-size: 64px; font-weight: 700; fill: #38BDF8; animation: blink 0.9s step-end infinite; }
    .sub { font-size: 18px; fill: #94A3B8; opacity: 0; animation: fade 0.5s ease forwards; letter-spacing: 1px; }
    .line { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: grow 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .name-container { animation: float 4s ease-in-out infinite; transform-origin: 450px 135px; }

    @keyframes flick  { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes reveal { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink  { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 0.4; } }
    @keyframes fade   { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes float  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  </style>

  <!-- Background -->
  <rect width="900" height="240" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="239" rx="16" fill="none" stroke="#1E293B"/>

  <!-- Random code fragments background -->
  <text class="t" x="60"  y="40"  style="animation-delay:0.1s;animation-duration:2.5s">fn()</text>
  <text class="t" x="180" y="110" style="animation-delay:0.5s;animation-duration:3.2s">0x1F</text>
  <text class="t" x="110" y="200" style="animation-delay:0.9s;animation-duration:2.8s">{ }</text>
  <text class="t" x="300" y="28"  style="animation-delay:0.3s;animation-duration:3.5s">01101</text>
  <text class="t" x="760" y="60"  style="animation-delay:0.7s;animation-duration:2.7s">=&gt;</text>
  <text class="t" x="840" y="150" style="animation-delay:0.2s;animation-duration:3.0s">[]</text>
  <text class="t" x="700" y="215" style="animation-delay:1.1s;animation-duration:3.8s">//</text>
  <text class="t" x="230" y="222" style="animation-delay:0.8s;animation-duration:2.6s">$_</text>
  <text class="t" x="600" y="28"  style="animation-delay:0.4s;animation-duration:3.1s">::</text>
  <text class="t" x="40"  y="130" style="animation-delay:1.2s;animation-duration:3.4s">#!</text>
  <text class="t" x="530" y="222" style="animation-delay:0.3s;animation-duration:2.9s">**</text>
  <text class="t" x="850" y="220" style="animation-delay:0.6s;animation-duration:3.2s">01</text>
  <text class="t" x="400" y="30"  style="animation-delay:0.8s;animation-duration:2.9s">async</text>
  <text class="t" x="470" y="218" style="animation-delay:0.7s;animation-duration:3.0s">0x7A</text>

  <!-- Name & Highlights Container -->
  <g class="name-container">
    <!-- Name: immediate snappy scramble animation without delay -->
    <g filter="url(#glow)">
      <!-- L (x=240) -->
      <text class="g" x="240" y="135" style="animation-delay:0s">#</text>
      <text class="g" x="240" y="135" style="animation-delay:0.04s">0</text>
      <text class="f" x="240" y="135" style="animation-delay:0.08s">L</text>

      <!-- y (x=292) -->
      <text class="g" x="292" y="135" style="animation-delay:0.03s">%</text>
      <text class="g" x="292" y="135" style="animation-delay:0.07s">1</text>
      <text class="f" x="292" y="135" style="animation-delay:0.12s">y</text>

      <!-- s (x=344) -->
      <text class="g" x="344" y="135" style="animation-delay:0.06s">&amp;</text>
      <text class="g" x="344" y="135" style="animation-delay:0.10s">7</text>
      <text class="f" x="344" y="135" style="animation-delay:0.16s">s</text>

      <!-- o (x=396) -->
      <text class="g" x="396" y="135" style="animation-delay:0.09s">/</text>
      <text class="g" x="396" y="135" style="animation-delay:0.13s">9</text>
      <text class="f" x="396" y="135" style="animation-delay:0.20s">o</text>

      <!-- n (x=448) -->
      <text class="g" x="448" y="135" style="animation-delay:0.12s">*</text>
      <text class="g" x="448" y="135" style="animation-delay:0.16s">2</text>
      <text class="f" x="448" y="135" style="animation-delay:0.24s">n</text>

      <!-- m (x=500) -->
      <text class="g" x="500" y="135" style="animation-delay:0.15s">5</text>
      <text class="g" x="500" y="135" style="animation-delay:0.19s">!</text>
      <text class="f" x="500" y="135" style="animation-delay:0.28s">m</text>

      <!-- n (x=552) -->
      <text class="g" x="552" y="135" style="animation-delay:0.18s">~</text>
      <text class="g" x="552" y="135" style="animation-delay:0.22s">4</text>
      <text class="f" x="552" y="135" style="animation-delay:0.32s">n</text>

      <!-- k (x=604) -->
      <text class="g" x="604" y="135" style="animation-delay:0.21s">;</text>
      <text class="g" x="604" y="135" style="animation-delay:0.25s">8</text>
      <text class="f" x="604" y="135" style="animation-delay:0.36s">k</text>
    </g>

    <!-- Blinking cursor -->
    <text class="cur" x="656" y="135">_</text>

    <!-- Accent line -->
    <rect class="line" x="240" y="152" width="416" height="2" fill="#38BDF8" style="animation-delay:0.36s"/>

    <!-- Subtitle: Updated to Backend Dev -->
    <text class="sub" x="450" y="188" text-anchor="middle" style="animation-delay:0.42s">Frontend Developer | Backend Dev</text>
  </g>
</svg>