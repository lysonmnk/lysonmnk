<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Courier New', Consolas, monospace; }
    .t   { font-size: 13px; fill: #38BDF8; opacity: 0; animation: twinkle 3.5s ease-in-out infinite; }
    .g   { font-size: 64px; font-weight: 700; fill: #38BDF8; opacity: 0; animation: flick 0.14s step-end 3; }
    .f   { font-size: 64px; font-weight: 700; fill: #F8FAFC; opacity: 0; animation: reveal 0.18s ease-out forwards; }
    .cur { font-size: 64px; font-weight: 700; fill: #38BDF8; animation: blink 1s step-end infinite; }
    .sub { font-size: 18px; fill: #94A3B8; opacity: 0; animation: fade 0.6s ease forwards; letter-spacing: 0.5px; }
    .line { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: grow 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes flick   { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes reveal  { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink   { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 0.35; } }
    @keyframes fade    { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow    { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>

  <!-- Background -->
  <rect width="900" height="240" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="239" rx="16" fill="none" stroke="#1E293B"/>

  <!-- Random code fragments -->
  <text class="t" x="60"  y="40"  style="animation-delay:0.3s;animation-duration:3.2s">fn()</text>
  <text class="t" x="180" y="110" style="animation-delay:0.9s;animation-duration:4.1s">0x1F</text>
  <text class="t" x="110" y="200" style="animation-delay:1.8s;animation-duration:3.6s">{ }</text>
  <text class="t" x="300" y="28"  style="animation-delay:0.6s;animation-duration:4.4s">01101</text>
  <text class="t" x="760" y="60"  style="animation-delay:1.4s;animation-duration:3.0s">=&gt;</text>
  <text class="t" x="840" y="150" style="animation-delay:0.2s;animation-duration:3.8s">[]</text>
  <text class="t" x="700" y="215" style="animation-delay:2.1s;animation-duration:4.6s">//</text>
  <text class="t" x="230" y="222" style="animation-delay:2.6s;animation-duration:3.3s">$_</text>
  <text class="t" x="600" y="28"  style="animation-delay:1.1s;animation-duration:3.9s">::</text>
  <text class="t" x="40"  y="130" style="animation-delay:2.2s;animation-duration:4.2s">#!</text>
  <text class="t" x="530" y="222" style="animation-delay:0.5s;animation-duration:3.5s">**</text>
  <text class="t" x="850" y="220" style="animation-delay:2.4s;animation-duration:4.0s">01</text>
  <text class="t" x="400" y="30"  style="animation-delay:1.5s;animation-duration:3.7s">async</text>
  <text class="t" x="470" y="218" style="animation-delay:1.3s;animation-duration:3.7s">0x7A</text>

  <!-- Name: Scramble decode animation (balanced, visible, and smooth) -->
  <g filter="url(#glow)">
    <!-- L (x=240) -->
    <text class="g" x="240" y="135" style="animation-delay:0s">x</text>
    <text class="g" x="240" y="135" style="animation-delay:0.08s">#</text>
    <text class="g" x="240" y="135" style="animation-delay:0.18s">0</text>
    <text class="f" x="240" y="135" style="animation-delay:0.40s">L</text>

    <!-- y (x=292) -->
    <text class="g" x="292" y="135" style="animation-delay:0.12s">%</text>
    <text class="g" x="292" y="135" style="animation-delay:0.20s">1</text>
    <text class="g" x="292" y="135" style="animation-delay:0.30s">{</text>
    <text class="f" x="292" y="135" style="animation-delay:0.52s">y</text>

    <!-- s (x=344) -->
    <text class="g" x="344" y="135" style="animation-delay:0.24s">&amp;</text>
    <text class="g" x="344" y="135" style="animation-delay:0.32s">7</text>
    <text class="g" x="344" y="135" style="animation-delay:0.42s">?</text>
    <text class="f" x="344" y="135" style="animation-delay:0.64s">s</text>

    <!-- o (x=396) -->
    <text class="g" x="396" y="135" style="animation-delay:0.36s">/</text>
    <text class="g" x="396" y="135" style="animation-delay:0.44s">9</text>
    <text class="g" x="396" y="135" style="animation-delay:0.54s">$</text>
    <text class="f" x="396" y="135" style="animation-delay:0.76s">o</text>

    <!-- n (x=448) -->
    <text class="g" x="448" y="135" style="animation-delay:0.48s">*</text>
    <text class="g" x="448" y="135" style="animation-delay:0.56s">2</text>
    <text class="g" x="448" y="135" style="animation-delay:0.66s">}</text>
    <text class="f" x="448" y="135" style="animation-delay:0.88s">n</text>

    <!-- m (x=500) -->
    <text class="g" x="500" y="135" style="animation-delay:0.60s">5</text>
    <text class="g" x="500" y="135" style="animation-delay:0.68s">!</text>
    <text class="g" x="500" y="135" style="animation-delay:0.78s">=</text>
    <text class="f" x="500" y="135" style="animation-delay:1.00s">m</text>

    <!-- n (x=552) -->
    <text class="g" x="552" y="135" style="animation-delay:0.72s">~</text>
    <text class="g" x="552" y="135" style="animation-delay:0.80s">4</text>
    <text class="g" x="552" y="135" style="animation-delay:0.90s">+</text>
    <text class="f" x="552" y="135" style="animation-delay:1.12s">n</text>

    <!-- k (x=604) -->
    <text class="g" x="604" y="135" style="animation-delay:0.84s">;</text>
    <text class="g" x="604" y="135" style="animation-delay:0.92s">8</text>
    <text class="g" x="604" y="135" style="animation-delay:1.02s">^</text>
    <text class="f" x="604" y="135" style="animation-delay:1.24s">k</text>
  </g>

  <!-- Blinking cursor -->
  <text class="cur" x="656" y="135">_</text>

  <!-- Accent line: smoothly grows right as name finishes resolving -->
  <rect class="line" x="240" y="152" width="416" height="2" fill="#38BDF8" style="animation-delay:1.24s"/>

  <!-- Subtitle: Updated cleanly to Backend Dev -->
  <text class="sub" x="450" y="188" text-anchor="middle" style="animation-delay:1.35s">Frontend Developer | Backend Dev</text>
</svg>