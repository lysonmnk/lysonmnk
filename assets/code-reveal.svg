<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <!-- Background Base Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Radial Neon Glows (Aurora / Nebula) -->
    <radialGradient id="coreGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cornerGlow" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyberpunk Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.07"/>
      <circle cx="30" cy="30" r="1" fill="#38BDF8" fill-opacity="0.15"/>
    </pattern>

    <!-- Scanning Laser Beam Gradient -->
    <linearGradient id="scanBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter for Name -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Particle Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    text { font-family: 'Courier New', Consolas, monospace; }

    /* Nebula Pulsing */
    .aurora-core {
      animation: pulseCore 6s ease-in-out infinite;
      transform-origin: 450px 120px;
    }
    @keyframes pulseCore {
      0%, 100% { opacity: 0.8; transform: scale(0.96); }
      50%      { opacity: 1; transform: scale(1.06); }
    }

    /* Scanning Laser Line */
    .scan-laser {
      animation: scanSweep 7s ease-in-out infinite;
    }
    @keyframes scanSweep {
      0%   { transform: translateY(0px); opacity: 0; }
      15%  { opacity: 0.65; }
      85%  { opacity: 0.65; }
      100% { transform: translateY(238px); opacity: 0; }
    }

    /* Ambient Floating Particles */
    .particle {
      font-size: 13px;
      fill: #38BDF8;
      animation: floatPart 5s ease-in-out infinite;
    }
    .p-fast { animation-duration: 3.5s; }
    .p-slow { animation-duration: 6.5s; }

    @keyframes floatPart {
      0%, 100% { opacity: 0.15; transform: translateY(0); }
      50%      { opacity: 0.45; transform: translateY(-6px); }
    }

    /* HUD Corner Pulsing */
    .hud-corner {
      stroke: #38BDF8;
      stroke-width: 1.5;
      fill: none;
      animation: hudPulse 4s ease-in-out infinite;
    }
    @keyframes hudPulse {
      0%, 100% { opacity: 0.4; stroke-width: 1.5; }
      50%      { opacity: 0.85; stroke-width: 2; filter: drop-shadow(0 0 3px #38BDF8); }
    }

    /* Blinking Cursor */
    .cur { font-size: 64px; font-weight: 700; fill: #38BDF8; animation: blink 0.8s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Cursor Movement across 7s infinite loop */
    .cursor-mover {
      animation: cursorMove 7s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    @keyframes cursorMove {
      0%, 4%     { transform: translateX(232px); }
      5%, 6.5%   { transform: translateX(284px); }
      7%, 8.5%   { transform: translateX(336px); }
      9%, 10.5%  { transform: translateX(388px); }
      11%, 12.5% { transform: translateX(440px); }
      13%, 14.5% { transform: translateX(492px); }
      15%, 16.5% { transform: translateX(544px); }
      17%, 19.5% { transform: translateX(596px); }
      20%, 64%   { transform: translateX(656px); }
      65%, 66.5% { transform: translateX(596px); }
      67%, 68.5% { transform: translateX(544px); }
      69%, 70.5% { transform: translateX(492px); }
      71%, 72.5% { transform: translateX(440px); }
      73%, 74.5% { transform: translateX(388px); }
      75%, 76.5% { transform: translateX(336px); }
      77%, 78.5% { transform: translateX(284px); }
      80%, 100%  { transform: translateX(232px); }
    }

    /* Final characters reveal & reverse-vanish */
    .f-0 { animation: char-0 7s ease forwards infinite; }
    .f-1 { animation: char-1 7s ease forwards infinite; }
    .f-2 { animation: char-2 7s ease forwards infinite; }
    .f-3 { animation: char-3 7s ease forwards infinite; }
    .f-4 { animation: char-4 7s ease forwards infinite; }
    .f-5 { animation: char-5 7s ease forwards infinite; }
    .f-6 { animation: char-6 7s ease forwards infinite; }
    .f-7 { animation: char-7 7s ease forwards infinite; }

    @keyframes char-0 { 0%, 4.5% { opacity: 0; } 5.0%, 79.5% { opacity: 1; } 80.0%, 100% { opacity: 0; } }
    @keyframes char-1 { 0%, 6.5% { opacity: 0; } 7.1%, 77.4% { opacity: 1; } 77.9%, 100% { opacity: 0; } }
    @keyframes char-2 { 0%, 8.7% { opacity: 0; } 9.3%, 75.2% { opacity: 1; } 75.7%, 100% { opacity: 0; } }
    @keyframes char-3 { 0%, 10.8% { opacity: 0; } 11.4%, 73.1% { opacity: 1; } 73.6%, 100% { opacity: 0; } }
    @keyframes char-4 { 0%, 13.0% { opacity: 0; } 13.6%, 70.9% { opacity: 1; } 71.4%, 100% { opacity: 0; } }
    @keyframes char-5 { 0%, 15.1% { opacity: 0; } 15.7%, 68.8% { opacity: 1; } 69.3%, 100% { opacity: 0; } }
    @keyframes char-6 { 0%, 17.3% { opacity: 0; } 17.9%, 66.6% { opacity: 1; } 67.1%, 100% { opacity: 0; } }
    @keyframes char-7 { 0%, 19.4% { opacity: 0; } 20.0%, 64.5% { opacity: 1; } 65.0%, 100% { opacity: 0; } }

    /* Glitch scramble glyphs */
    .g-0 { animation: glitch-0 7s step-end infinite; }
    .g-1 { animation: glitch-1 7s step-end infinite; }
    .g-2 { animation: glitch-2 7s step-end infinite; }
    .g-3 { animation: glitch-3 7s step-end infinite; }
    .g-4 { animation: glitch-4 7s step-end infinite; }
    .g-5 { animation: glitch-5 7s step-end infinite; }
    .g-6 { animation: glitch-6 7s step-end infinite; }
    .g-7 { animation: glitch-7 7s step-end infinite; }

    @keyframes glitch-0 { 0% { opacity: 0; } 1.5%, 3.5% { opacity: 1; } 5.0%, 78.5% { opacity: 0; } 79.0%, 80.0% { opacity: 1; } 80.5%, 100% { opacity: 0; } }
    @keyframes glitch-1 { 0%, 4.5% { opacity: 0; } 5.2%, 6.5% { opacity: 1; } 7.1%, 76.5% { opacity: 0; } 77.0%, 78.0% { opacity: 1; } 78.5%, 100% { opacity: 0; } }
    @keyframes glitch-2 { 0%, 6.5% { opacity: 0; } 7.3%, 8.5% { opacity: 1; } 9.3%, 74.5% { opacity: 0; } 75.0%, 76.0% { opacity: 1; } 76.5%, 100% { opacity: 0; } }
    @keyframes glitch-3 { 0%, 8.5% { opacity: 0; } 9.5%, 10.5% { opacity: 1; } 11.4%, 72.5% { opacity: 0; } 73.0%, 74.0% { opacity: 1; } 74.5%, 100% { opacity: 0; } }
    @keyframes glitch-4 { 0%, 10.5% { opacity: 0; } 11.7%, 12.8% { opacity: 1; } 13.6%, 70.3% { opacity: 0; } 70.8%, 71.8% { opacity: 1; } 72.3%, 100% { opacity: 0; } }
    @keyframes glitch-5 { 0%, 12.8% { opacity: 0; } 13.8%, 15.0% { opacity: 1; } 15.7%, 68.2% { opacity: 0; } 68.7%, 69.7% { opacity: 1; } 70.2%, 100% { opacity: 0; } }
    @keyframes glitch-6 { 0%, 15.0% { opacity: 0; } 16.0%, 17.0% { opacity: 1; } 17.9%, 66.0% { opacity: 0; } 66.5%, 67.5% { opacity: 1; } 68.0%, 100% { opacity: 0; } }
    @keyframes glitch-7 { 0%, 17.0% { opacity: 0; } 18.2%, 19.3% { opacity: 1; } 20.0%, 63.8% { opacity: 0; } 64.3%, 65.3% { opacity: 1; } 65.8%, 100% { opacity: 0; } }

    /* Accent line expands & contracts */
    .line {
      transform-box: fill-box;
      transform-origin: 0 50%;
      animation: lineCycle 7s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    @keyframes lineCycle {
      0%, 19%   { transform: scaleX(0); }
      24%, 60%  { transform: scaleX(1); }
      64%, 100% { transform: scaleX(0); }
    }

    /* Subtitle fades in & out */
    .sub {
      font-size: 18px;
      fill: #94A3B8;
      letter-spacing: 0.5px;
      animation: subCycle 7s ease infinite;
    }
    @keyframes subCycle {
      0%, 20%   { opacity: 0; transform: translateY(4px); }
      26%, 59%  { opacity: 1; transform: translateY(0); }
      64%, 100% { opacity: 0; transform: translateY(4px); }
    }

    /* Typography bases */
    .letter-base { font-size: 64px; font-weight: 700; fill: #F8FAFC; }
    .glitch-base { font-size: 64px; font-weight: 700; fill: #38BDF8; }
  ]]></style>

  <!-- Layer 1: Dark Tech Canvas Base -->
  <rect width="900" height="240" rx="16" fill="url(#bg)"/>

  <!-- Layer 2: Cyber Digital Grid -->
  <rect width="900" height="240" rx="16" fill="url(#cyberGrid)"/>

  <!-- Layer 3: Neon Aurora Core Glow (Pulsing behind name) -->
  <g class="aurora-core">
    <ellipse cx="450" cy="130" rx="280" ry="85" fill="url(#coreGlow)"/>
    <ellipse cx="750" cy="50" rx="180" ry="70" fill="url(#cornerGlow)"/>
  </g>

  <!-- Layer 4: Scanning Laser Beam Effect -->
  <g class="scan-laser">
    <rect x="0" y="0" width="900" height="2" fill="url(#scanBeam)"/>
  </g>

  <!-- Layer 5: Terminal Header Bar & Dots -->
  <g opacity="0.75">
    <circle cx="28" cy="22" r="4.5" fill="#EF4444"/>
    <circle cx="44" cy="22" r="4.5" fill="#F59E0B"/>
    <circle cx="60" cy="22" r="4.5" fill="#10B981"/>
    <text x="80" y="26" font-size="11" fill="#475569" letter-spacing="1">terminal: bash - lysonmnk@profile:~</text>
    <text x="860" y="26" font-size="10" fill="#38BDF8" font-weight="700" text-anchor="end" opacity="0.6">SYS:ONLINE 🟢</text>
  </g>

  <!-- Layer 6: Cyberpunk HUD Corner Brackets -->
  <g>
    <!-- Top-Left Bracket -->
    <path class="hud-corner" d="M 14,34 L 14,14 L 34,14"/>
    <!-- Top-Right Bracket -->
    <path class="hud-corner" d="M 886,34 L 886,14 L 866,14"/>
    <!-- Bottom-Left Bracket -->
    <path class="hud-corner" d="M 14,206 L 14,226 L 34,226"/>
    <!-- Bottom-Right Bracket -->
    <path class="hud-corner" d="M 886,206 L 886,226 L 866,226"/>
  </g>

  <!-- Layer 7: Outer Border -->
  <rect x="0.5" y="0.5" width="899" height="239" rx="16" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Layer 8: Floating Tech Code Elements -->
  <g filter="url(#softGlow)">
    <text class="particle p-slow" x="55"  y="65"  style="animation-delay:0.3s">fn()</text>
    <text class="particle p-fast" x="160" y="105" style="animation-delay:1.1s">0x1F</text>
    <text class="particle p-slow" x="115" y="195" style="animation-delay:2.4s">{ }</text>
    <text class="particle p-fast" x="310" y="45"  style="animation-delay:0.8s">01101</text>
    <text class="particle p-slow" x="780" y="65"  style="animation-delay:1.9s">=&gt;</text>
    <text class="particle p-fast" x="840" y="145" style="animation-delay:0.2s">[]</text>
    <text class="particle p-slow" x="720" y="210" style="animation-delay:2.7s">//</text>
    <text class="particle p-fast" x="220" y="215" style="animation-delay:1.5s">$_</text>
    <text class="particle p-slow" x="620" y="48"  style="animation-delay:1.3s">::</text>
    <text class="particle p-fast" x="45"  y="140" style="animation-delay:3.1s">#!</text>
    <text class="particle p-slow" x="540" y="218" style="animation-delay:0.6s">**</text>
    <text class="particle p-fast" x="845" y="215" style="animation-delay:2.8s">01</text>
    <text class="particle p-slow" x="420" y="45"  style="animation-delay:1.7s">async</text>
    <text class="particle p-fast" x="485" y="215" style="animation-delay:1.0s">0x7A</text>
  </g>

  <!-- Layer 9: Name & Typing Decode Sequence with Glow -->
  <g filter="url(#glow)">
    <!-- Letter L (x=240) -->
    <text class="glitch-base g-0" x="240" y="140">#</text>
    <text class="letter-base f-0" x="240" y="140">L</text>

    <!-- Letter y (x=292) -->
    <text class="glitch-base g-1" x="292" y="140">%</text>
    <text class="letter-base f-1" x="292" y="140">y</text>

    <!-- Letter s (x=344) -->
    <text class="glitch-base g-2" x="344" y="140">&amp;</text>
    <text class="letter-base f-2" x="344" y="140">s</text>

    <!-- Letter o (x=396) -->
    <text class="glitch-base g-3" x="396" y="140">/</text>
    <text class="letter-base f-3" x="396" y="140">o</text>

    <!-- Letter n (x=448) -->
    <text class="glitch-base g-4" x="448" y="140">*</text>
    <text class="letter-base f-4" x="448" y="140">n</text>

    <!-- Letter m (x=500) -->
    <text class="glitch-base g-5" x="500" y="140">5</text>
    <text class="letter-base f-5" x="500" y="140">m</text>

    <!-- Letter n (x=552) -->
    <text class="glitch-base g-6" x="552" y="140">~</text>
    <text class="letter-base f-6" x="552" y="140">n</text>

    <!-- Letter k (x=604) -->
    <text class="glitch-base g-7" x="604" y="140">;</text>
    <text class="letter-base f-7" x="604" y="140">k</text>

    <!-- Interactive traveling terminal cursor -->
    <g class="cursor-mover">
      <text class="cur" x="0" y="140">_</text>
    </g>
  </g>

  <!-- Layer 10: Accent Line -->
  <rect class="line" x="240" y="157" width="416" height="2" fill="#38BDF8"/>

  <!-- Layer 11: Subtitle -->
  <text class="sub" x="450" y="193" text-anchor="middle">Frontend Developer | Backend Developer</text>
</svg>