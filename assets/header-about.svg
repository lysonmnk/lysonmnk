<svg xmlns="http://www.w3.org/2000/svg" width="900" height="54" viewBox="0 0 900 54">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <pattern id="cyberGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.08"/>
    </pattern>

    <linearGradient id="laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    text { font-family: 'Courier New', Consolas, monospace; }
    .hud { stroke: #38BDF8; stroke-width: 1.2; fill: none; opacity: 0.55; }
    .title { font-size: 16px; font-weight: 700; fill: #F8FAFC; letter-spacing: 1px; }
    .sub { font-size: 12px; fill: #94A3B8; letter-spacing: 0.5px; }
    .tag-text { font-size: 10px; font-weight: 700; fill: #38BDF8; letter-spacing: 1px; }
    .laser-line { animation: sweep 6s ease-in-out infinite; transform-origin: 450px 53px; }
    @keyframes sweep {
      0%, 100% { opacity: 0.2; transform: scaleX(0.7); }
      50%      { opacity: 0.8; transform: scaleX(1); }
    }
  ]]></style>

  <!-- Base Card -->
  <rect width="900" height="54" rx="10" fill="url(#bg)"/>
  <rect width="900" height="54" rx="10" fill="url(#cyberGrid)"/>
  <rect x="0.5" y="0.5" width="899" height="53" rx="10" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Terminal Window Dots -->
  <circle cx="24" cy="27" r="3.5" fill="#EF4444" opacity="0.8"/>
  <circle cx="36" cy="27" r="3.5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="48" cy="27" r="3.5" fill="#10B981" opacity="0.8"/>

  <!-- Corner HUD Accents -->
  <path class="hud" d="M 10,20 L 10,10 L 20,10"/>
  <path class="hud" d="M 890,20 L 890,10 L 880,10"/>
  <path class="hud" d="M 10,34 L 10,44 L 20,44"/>
  <path class="hud" d="M 890,34 L 890,44 L 880,44"/>

  <!-- Section Title &amp; Subtitle with Glow -->
  <g filter="url(#glow)">
    <text class="title" x="72" y="33">// 01 : ABOUT ME</text>
  </g>
  <text class="sub" x="315" y="33">|  Core Profile &amp; Focus</text>

  <!-- Right Module Tag -->
  <rect x="750" y="15" width="128" height="24" rx="5" fill="#0B132B" stroke="#1E293B"/>
  <text class="tag-text" x="814" y="31" text-anchor="middle">[SYS:ABOUT]</text>

  <!-- Bottom Laser Line -->
  <line class="laser-line" x1="70" y1="53" x2="830" y2="53" stroke="url(#laser)" stroke-width="1.5"/>
</svg>